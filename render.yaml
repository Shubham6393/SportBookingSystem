services:
  - type: web
    name: sports-booking-system
    runtime: nixpacks
    buildCommand: nixpacks build
    startCommand: php artisan serve --host=0.0.0.0 --port=${PORT}
    env: php
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: PHP_VERSION
        value: 8.3 